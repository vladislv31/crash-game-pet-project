services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crash}
      POSTGRES_DB: ${POSTGRES_DB:-crash}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF on: experiment 3 kills instances mid-round, Redis state must survive restarts
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Observability (ADR-0006): `docker compose --profile observability up -d`.
  # Kept out of the default profile, so integration tests start only Postgres and Redis.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    # The game server runs on the host; this name reaches it from the container on Linux too.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    depends_on:
      - prometheus
    environment:
      # Local only: no login, everyone is admin.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
